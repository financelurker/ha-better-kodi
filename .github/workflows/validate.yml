name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # No brand icon yet (custom integrations can ship one in brand/ since HA 2026.3).
          ignore: brands

  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: README image URLs up to date
        run: python scripts/readme_images.py --check
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest.log
      - name: Report pytest output
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 60 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=pytest output::${msg}"
